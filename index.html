<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC TIERS - Rankings</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Header Section -->
  <div class="navbar">
    <div class="nav-brand">MCTIERS</div>
    <div class="nav-links">
      <a href="#" class="active">Rankings</a>
      <a href="#">Discords</a>
      <a href="#">API Docs</a>
    </div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search player..." onkeyup="filterPlayers()">
    </div>
  </div>

  <!-- Gamemodes -->
  <div class="modes-bar">
    <button class="mode-btn active">Overall</button>
    <button class="mode-btn">LTMs</button>
    <button class="mode-btn">Vanilla</button>
    <button class="mode-btn">UHC</button>
    <button class="mode-btn">Pot</button>
    <button class="mode-btn">NethOP</button>
    <button class="mode-btn">SMP</button>
  </div>

  <!-- Main Table -->
  <div class="card-container">
    <table class="mctable">
      <thead>
        <tr>
          <th>#</th>
          <th>PLAYER</th>
          <th>REGION</th>
          <th>TIERS</th>
        </tr>
      </thead>
      <tbody id="player-rows">
        <!-- JS populates rows -->
      </tbody>
    </table>
  </div>

  <script src="./script.js"></script>
</body>
</html>
