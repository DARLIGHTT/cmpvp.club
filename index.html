<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCTIERS — Minecraft PvP Rankings</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="#">
      <span class="logo-mc">MC</span><span class="logo-tiers">TIERS</span>
    </a>

    <nav class="main-nav">
      <a href="#" class="nav-link active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Home
      </a>
      <a href="#" class="nav-link">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M6 4h12v4a6 6 0 0 1-12 0V4Z"/><path d="M6 6H3v1a4 4 0 0 0 3.5 4M18 6h3v1a4 4 0 0 1-3.5 4"/></svg>
        Rankings
      </a>
      <a href="#" class="nav-link">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="12" r="4"/><circle cx="16" cy="12" r="4"/></svg>
        Discords
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </a>
      <a href="#" class="nav-link">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        API Docs
      </a>
    </nav>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" placeholder="Search player..." class="search-input">
      <kbd class="search-kbd">/</kbd>
    </div>
  </div>
</header>

<!-- ============ CATEGORY TABS ============ -->
<div class="tabs-wrap">
  <div class="tabs-inner" id="tabs">
    <!-- populated by JS -->
  </div>
</div>

<!-- ============ MAIN CONTENT ============ -->
<main class="page">
  <div class="board-toolbar">
    <button class="info-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      Information
    </button>

    <div class="server-info">
      <img class="server-logo" src="https://mc-heads.net/avatar/MHF_Question/32" alt="">
      <div class="server-text">
        <span class="server-label">SERVER IP</span>
        <span class="server-ip">mcpvp.club</span>
      </div>
      <button class="copy-btn" title="Copy IP">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
      <a class="discord-btn" href="#" title="Discord">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.7A19.8 19.8 0 0 0 15.6 3c-.2.4-.5.9-.7 1.3a18 18 0 0 0-5.8 0A9 9 0 0 0 8.4 3a19.7 19.7 0 0 0-4.7 1.7C1 9.4.3 14 .6 18.5a20 20 0 0 0 6 3c.5-.6.9-1.3 1.2-2a13 13 0 0 1-1.9-.9l.5-.4a14.3 14.3 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 .9.4.7.8 1.4 1.3 2a20 20 0 0 0 6-3c.4-5.2-1-9.8-3.6-13.8ZM8.3 15.8c-1.1 0-2-1-2-2.3 0-1.2.9-2.3 2-2.3s2 1 2 2.3-.9 2.3-2 2.3Zm7.4 0c-1.1 0-2-1-2-2.3 0-1.2.9-2.3 2-2.3s2 1 2 2.3-.9 2.3-2 2.3Z"/></svg>
      </a>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header-row">
      <div class="col col-rank">#</div>
      <div class="col col-player">PLAYER</div>
      <div class="col col-region">REGION</div>
      <div class="col col-tiers">TIERS</div>
    </div>

    <div id="rows"></div>
  </div>
</main>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
