<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Tiers - Leaderboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">MC TIERS</div>
    <div class="nav-links">
      <a href="#" class="active">Overall</a>
      <a href="#">LTMs</a>
      <a href="#">Vanilla</a>
      <a href="#">UHC</a>
      <a href="#">Pot</a>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container">
    <table class="leaderboard">
      <thead>
        <tr>
          <th>#</th>
          <th>PLAYER</th>
          <th>REGION</th>
          <th>TIERS</th>
        </tr>
      </thead>
      <tbody id="player-rows">
        <!-- JavaScript will automatically populate rows here -->
      </tbody>
    </table>
  </main>

  <script src="script.js"></script>
</body>
</html>
